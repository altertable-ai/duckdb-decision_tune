[project]
name = "decide-onnx-export"
version = "1.0.0"
description = "Exports the vela3-fast decision backbone to ONNX for the decide_onnx DuckDB extension"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub",
    "numpy",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "onnxscript==0.7.2",
    "safetensors",
    "tokenizers",
    "torch==2.14.1",
    "transformers==5.17.0",
]

[tool.uv]
package = false
