#
# Builds the extension on Linux and checks the tokenizer and the decision functions against the published vela3-fast
# code (test/data/parity, from scripts/export/make_fixtures.py), using the ONNX export on assets.altertable.ai. The
# distribution pipeline skips these tests because they need the model files.
#
name: Parity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Parity with the vela3-fast reference
    runs-on: ubuntu-latest
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux-release
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      # ONNX Runtime takes a long time to build from source; keep vcpkg's binary packages between runs.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg_ports/**', 'toolchains/**') }}

      - name: Create the vcpkg cache directory
        run: mkdir -p vcpkg-cache

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: Build
        run: make release

      - name: Download vela3-fast (ONNX export)
        run: |
          mkdir -p models
          base=https://assets.altertable.ai/decide_onnx/$(grep -o 'ASSET_VERSION = "[^"]*"' src/include/decide_onnx/model_manifest.hpp | cut -d'"' -f2)
          for f in tokenizer.json model.onnx; do
            curl --fail --retry 3 -L -o "models/$f" "$base/$f"
            expected=$(grep -o "\"$f\", \"[0-9a-f]\{64\}\"" src/include/decide_onnx/model_manifest.hpp | grep -o '[0-9a-f]\{64\}')
            echo "${expected}  models/$f" | sha256sum --check
          done

      - name: Test
        run: DECIDE_ONNX_MODEL_PATH=$PWD/models make test
